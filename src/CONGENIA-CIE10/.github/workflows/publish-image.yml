name: publish-image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-cie10-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod

      - name: Calcular el tag
        id: tag
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="${version}-$(git rev-parse --short=7 HEAD)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Tag: $tag"

      - name: Mostrar identidad OIDC sin exponer el token
        uses: actions/github-script@v7
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            core.info(JSON.stringify({
              role: process.env.AWS_ROLE_ARN,
              subject: claims.sub,
              audience: claims.aud,
              repository: claims.repository,
              ref: claims.ref,
            }, null, 2));

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Ver si el tag ya existe
        id: existe
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if aws ecr describe-images \
               --repository-name congenia/cie10 \
               --image-ids "imageTag=$TAG" >/dev/null 2>&1; then
            echo "valor=true" >> "$GITHUB_OUTPUT"
            echo "La imagen congenia/cie10:$TAG ya esta publicada; no se reconstruye."
          else
            echo "valor=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.existe.outputs.valor == 'false'

      - uses: docker/build-push-action@v6
        if: steps.existe.outputs.valor == 'false'
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ vars.ECR_REGISTRY }}/congenia/cie10:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Version disponible para despliegue manual
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "Imagen publicada: $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Desplegar desde CONGENIA-INFRA → Actions → deploy-production → Run workflow." >> "$GITHUB_STEP_SUMMARY"

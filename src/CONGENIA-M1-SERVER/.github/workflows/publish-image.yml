# =============================================================================
# Publica la imagen de la API en ECR.
#
# Sustituye el ciclo manual que exigia clonar los cinco repositorios, correr
# las pruebas a mano y pegar comandos de `docker buildx` desde una laptop.
# El runner ya es amd64, asi que tampoco hay cross-build desde Mac ARM.
#
# El tag se deriva del commit (version de package.json + sha corto), igual
# que en `scripts/release-plan.sh` del orquestador: las dos vias de publicacion
# tienen que poder calcular el mismo tag para el mismo codigo.
#
# ECR esta en modo inmutable. En vez de dejar que el push falle, el workflow
# comprueba antes si el tag existe y se salta la construccion: reintentar el
# mismo commit es un no-op en verde, no un error rojo.
# =============================================================================
name: publish-image

on:
  push:
    branches:
      - main
  workflow_dispatch:

# `id-token` es lo que permite pedirle a AWS credenciales por OIDC. Sin esto no
# hay forma de asumir el rol y habria que guardar llaves en el repositorio.
permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          # El tag de migrate se calcula mirando el historial de db/, asi que
          # el clon superficial por defecto no alcanza.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev

      - name: Calcular el tag
        id: tag
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="${version}-$(git rev-parse --short=7 HEAD)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Tag: $tag"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Ver si el tag ya existe
        id: existe
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if aws ecr describe-images \
               --repository-name congenia/api \
               --image-ids "imageTag=$TAG" >/dev/null 2>&1; then
            echo "valor=true" >> "$GITHUB_OUTPUT"
            echo "La imagen congenia/api:$TAG ya esta publicada; no se reconstruye."
          else
            echo "valor=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.existe.outputs.valor == 'false'

      - uses: docker/build-push-action@v6
        if: steps.existe.outputs.valor == 'false'
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ vars.ECR_REGISTRY }}/congenia/api:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Version disponible para despliegue manual
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "Imagen publicada: $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Desplegar desde CONGENIA-INFRA → Actions → deploy-production → Run workflow." >> "$GITHUB_STEP_SUMMARY"
